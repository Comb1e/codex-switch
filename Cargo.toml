[package]
name = "codex-switch"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Switch named Codex API endpoint and API-key profiles"

[[bin]]
name = "cs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
atomicwrites = "0.4"
clap = { version = "4.5", features = ["derive"] }
directories = "6"
fs2 = "0.4"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.23"
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
